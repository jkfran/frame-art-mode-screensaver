name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-suffix for a pre-release) builds the signed APK and
# publishes it as a GitHub release. versionName in app/build.gradle.kts must equal the
# tag without its leading "v".
#
# Repository secrets:
#   FRAME_KEYSTORE_BASE64    the release keystore, base64-encoded
#   FRAME_KEYSTORE_PASSWORD  the keystore password
#   FRAME_KEY_ALIAS          the alias of the signing key
#   FRAME_KEY_PASSWORD       the password of the signing key

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build and publish the signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read the version from the tag
        id: version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not of the form vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-SUFFIX."
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # A release is built from a clean Gradle home. Wrapper validation is on by default.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Decode the signing keystore
        env:
          FRAME_KEYSTORE_BASE64: ${{ secrets.FRAME_KEYSTORE_BASE64 }}
          FRAME_KEYSTORE_PASSWORD: ${{ secrets.FRAME_KEYSTORE_PASSWORD }}
          FRAME_KEY_ALIAS: ${{ secrets.FRAME_KEY_ALIAS }}
          FRAME_KEY_PASSWORD: ${{ secrets.FRAME_KEY_PASSWORD }}
        run: |
          for secret in FRAME_KEYSTORE_BASE64 FRAME_KEYSTORE_PASSWORD FRAME_KEY_ALIAS FRAME_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::The repository secret $secret is not set."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$FRAME_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "FRAME_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Test and build the signed release APK
        env:
          FRAME_KEYSTORE_PASSWORD: ${{ secrets.FRAME_KEYSTORE_PASSWORD }}
          FRAME_KEY_ALIAS: ${{ secrets.FRAME_KEY_ALIAS }}
          FRAME_KEY_PASSWORD: ${{ secrets.FRAME_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Verify the signature and the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::$apk was not built. Is the release signing configuration in place?"
            ls -l app/build/outputs/apk/release || true
            exit 1
          fi

          build_tools=$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)

          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apksigner.txt"
          if grep -q 'CN=Android Debug' "$RUNNER_TEMP/apksigner.txt"; then
            echo "::error::The release APK is signed with a debug key."
            exit 1
          fi

          apk_version=$("$build_tools/aapt2" dump badging "$apk" | sed -n "s/^package: .* versionName='\([^']*\)'.*/\1/p")
          if [ "$apk_version" != "$VERSION" ]; then
            echo "::error::The APK's versionName is '$apk_version' but the tag is for '$VERSION'. Update versionName and versionCode in app/build.gradle.kts."
            exit 1
          fi

          name="frame-art-mode-screensaver-$VERSION.apk"
          mkdir -p dist
          cp "$apk" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          cat "dist/$name.sha256"

      - name: Upload the R8 mapping file
        uses: actions/upload-artifact@v7
        with:
          name: mapping-${{ steps.version.outputs.version }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="frame-art-mode-screensaver-$VERSION.apk"
          notes="$RUNNER_TEMP/release-notes.md"
          : > "$notes"

          # The notes are this version's section of CHANGELOG.md ("## [X.Y.Z]" or
          # "## X.Y.Z"), or GitHub's generated notes when there is none.
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              /^## / {
                if (found) exit
                h = substr($0, 4)
                sub(/^ +/, "", h)
                if (substr(h, 1, 1) == "[") h = substr(h, 2)
                if (substr(h, 1, 1) == "v") h = substr(h, 2)
                c = substr(h, length(v) + 1, 1)
                if (substr(h, 1, length(v)) == v && (c == "" || c == "]" || c == " ")) found = 1
                next
              }
              found && /^\[/ && index($0, "]: ") { exit }
              found { print }
            ' CHANGELOG.md > "$notes"
          fi

          args=(--title "$GITHUB_REF_NAME" --verify-tag)
          if grep -q '[^[:space:]]' "$notes"; then
            args+=(--notes-file "$notes")
          else
            args+=(--generate-notes)
          fi
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" "dist/$name" "dist/$name.sha256" "${args[@]}"
